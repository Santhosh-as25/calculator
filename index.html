<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simpleCalculator</title>
</head>
<script>
    function calculate(){
        value1=Number(document.getElementById("value1").value);
        value2=Number(document.getElementById("value2").value);
        op=document.getElementById("choose").value;
        
        if(op=="+"){
            result=value1+value2;
        }else if(op=="-"){
            result=value1-value2;
        }else if(op=="*"){
            result=value1*value2;
        }else {
            result=value1/value2;
        }
        document.getElementById("result").value=result;
    }


    
</script>
<body>
   
        <lable for="value1">Value1:</lable>
    <input type="number" id="value1" oninput=calculate()  required>
    <lable for="choose">Choose:</lable>
     <select id="choose" oninput=calculate()>
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>
    <lable for="value2">Value2:</lable>
    <input type="number" id="value2" oninput=calculate() required>
    <lable for="result">result:</lable>

    <input type="text" id="result"  readonly >

    
   

    
</body>
</html>
